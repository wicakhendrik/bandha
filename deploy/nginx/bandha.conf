# nginx server blocks for Bandha. Copy to /etc/nginx/sites-available/, replace the names and ports, enable, then
# get the certificates:   sudo certbot --nginx -d bandha.grezly.app -d bandha-dev.grezly.app
#
# Ports are the WEB_PORT / API_PORT values of each environment's deploy/.env. The containers listen on 127.0.0.1 only.
#
# IMPORTANT: the headers below OVERWRITE X-Forwarded-For with the real client address. Bandha rate-limits sign-in and
# password reset per client address, so this header must come from nginx, never from the visitor.

# ---------- production: main branch ----------
server {
    listen 80;
    server_name bandha.grezly.app;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name bandha.grezly.app;
    # certbot fills in ssl_certificate / ssl_certificate_key

    client_max_body_size 2m;               # CSV imports are limited to 1 MB by the app
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3000;  # WEB_PORT of production
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ---------- development: development branch ----------
server {
    listen 80;
    server_name bandha-dev.grezly.app;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name bandha-dev.grezly.app;

    client_max_body_size 2m;
    # keep the development site out of search engines
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3100;  # WEB_PORT of development
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

