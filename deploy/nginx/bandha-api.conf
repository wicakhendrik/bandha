# Public API addresses for the MOBILE APP (the website does not need them: its server talks to the API inside Docker).
#
# The app talks to the API directly, so each environment needs an address the phone can reach:
#   production   api-bandha.grezly.app       -> API_PORT of production  (4000)
#   development  api-bandha-dev.grezly.app   -> API_PORT of development (4100 by default; use the value in deploy/.env on your server)
#
# Setup, per address (development shown):
#   1. DNS: an A record  api-bandha-dev.grezly.app  pointing at the same server IP as bandha-dev.grezly.app.
#   2. Copy this file:   sudo cp deploy/nginx/bandha-api.conf /etc/nginx/sites-available/bandha-api
#                        sudo ln -s /etc/nginx/sites-available/bandha-api /etc/nginx/sites-enabled/
#      Port 80 only on purpose: certbot adds the HTTPS part itself, nginx would refuse to start with a missing certificate.
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d api-bandha-dev.grezly.app      (add  -d api-bandha.grezly.app  for production)
#   5. Check:  curl https://api-bandha-dev.grezly.app/api/health      ->  {"status":"ok"}
#
# IMPORTANT: the headers below OVERWRITE X-Forwarded-For with the real client address. Bandha rate-limits sign-in and
# password reset per client address, so this header must come from nginx, never from the visitor.
# The app refuses plain http in release builds, so always finish the certbot step.

server {
    listen 80;
    server_name api-bandha-dev.grezly.app;
    client_max_body_size 2m;               # CSV imports are limited to 1 MB by the app
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:4100;  # API_PORT of development
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name api-bandha.grezly.app;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:4000;  # API_PORT of production
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
