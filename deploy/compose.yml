# One copy of this stack per environment (development, production). Run it with:
#   docker compose --env-file deploy/.env -f deploy/compose.yml up -d
# Everything that differs between environments lives in deploy/.env (see deploy/env.example).
#
# Nothing here is published on a public address: the database is only reachable from inside the stack, and the web
# and API ports are bound to 127.0.0.1 for the reverse proxy (nginx) on the same machine.
name: ${COMPOSE_PROJECT_NAME:-bandha}

x-api-image: &api-image
  image: bandha-api:${TAG:-local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile.api

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bandha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-bandha}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs once per deploy: applies new schema migrations, then adds any missing catalog assets. Both are idempotent.
  migrate:
    <<: *api-image
    restart: "no"
    command: ["sh", "-c", "pnpm --filter @bandha/db migrate && pnpm --filter @bandha/db seed"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bandha}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bandha}
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api-image
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bandha}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bandha}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      API_PORT: "4000"
      NODE_ENV: ${APP_ENV:-production}
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN in deploy/.env}
      APP_URL: ${APP_URL:?set APP_URL in deploy/.env}
      MARKET_PROVIDER: ${MARKET_PROVIDER:-coingecko}
      MARKET_SYNC_INTERVAL_MIN: ${MARKET_SYNC_INTERVAL_MIN:-15}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-console}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Bandha <no-reply@bandha.grezly.app>}
      REQUIRE_EMAIL_OTP: ${REQUIRE_EMAIL_OTP:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      # Only needed when the mobile app must reach the API (put an nginx api.* host in front of this port).
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    image: bandha-web:${TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  pgdata:
