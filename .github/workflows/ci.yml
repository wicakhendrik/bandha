name: CI & deploy

# Every push and pull request is checked. A push to `development` or `main` that passes is then deployed to the server
# (development -> bandha-dev.grezly.app, main -> bandha.grezly.app) by running deploy/deploy.sh over SSH.
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bandha
          POSTGRES_PASSWORD: bandha
          POSTGRES_DB: bandha
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U bandha -d bandha" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://bandha:bandha@localhost:5434/bandha
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Integration tests (real Postgres)
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm test:integration
      - run: pnpm --filter @bandha/web build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile.api -t bandha-api:ci .
      - run: docker build -f deploy/Dockerfile.web -t bandha-web:ci .

  deploy:
    name: Deploy
    needs: [check, docker]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Each branch has its own GitHub Environment holding that server's secrets (Settings > Environments):
    #   VPS_HOST, VPS_USER, VPS_SSH_KEY (private key), VPS_KNOWN_HOSTS (output of `ssh-keyscan -H <host>`),
    #   VPS_PATH (the clone on the server, e.g. /srv/bandha-dev), and optionally VPS_PORT.
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false   # never interrupt a deploy that is already running
    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for v in VPS_HOST VPS_USER VPS_PATH SSH_KEY KNOWN_HOSTS; do [ -n "${!v}" ] || { echo "missing secret for $v"; exit 1; }; done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_PATH' && DEPLOY_BRANCH='$BRANCH' bash deploy/deploy.sh"
